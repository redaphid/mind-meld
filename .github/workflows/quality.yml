# Quality ratchet (issue #43): dead code and test coverage are allowed to
# improve, never to regress. Warnings-first: the remaining debt recorded in
# quality/*.json shows up as warning annotations, not failures. The job FAILS
# only on a regression (new knip finding, coverage drop) or a stale baseline
# (an improvement that was not ratcheted into quality/*.json).
#
# Anti-cheating (see docs/quality-ratchet.md): raising the numbers by deleting
# tests, narrowing coverage include, adding knip ignores without justification
# comments, or hand-growing the baselines is rejected in review. Baselines may
# only grow by hand, with a written justification in the PR.
#
# This workflow is deliberately separate from release.yml, which is
# semver-gated and must not be disturbed.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # A workflow that does not parse never runs, and GitHub reports that almost
  # invisibly — it names the workflow after its own file path and produces
  # zero-second "failures" with no retrievable log. The coordinator deadman
  # reached `main` that way, red on every push, never executed once. This job
  # is the guard: an unparseable or malformed workflow now fails the PR.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub workflows
        env:
          ACTIONLINT_VERSION: "1.7.7"
          # actionlint runs shellcheck over every `run:` block. Warning and
          # above blocks the PR; shellcheck's `info` level (style notes such as
          # SC2086 on deliberately word-split output) does not, so this job
          # stays a guard against workflows that cannot run rather than a
          # style gate that everyone learns to ignore.
          SHELLCHECK_OPTS: "-S warning"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  quality:
    runs-on: ubuntu-latest
    # For the suites that need real PostgreSQL (src/__tests__/scratch-database.ts).
    # Only the "Database tests" step points at it, so coverage is measured the
    # way a checkout without a database measures it and the ratchet means the
    # same thing in both places.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mindmeld
          POSTGRES_PASSWORD: mindmeld
          POSTGRES_DB: conversations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindmeld -d conversations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Tests with coverage
        run: pnpm run test:coverage

      # The whole suite again, now with a database: REQUIRE_DATABASE makes a
      # suite that cannot reach it fail instead of skipping.
      - name: Database tests
        env:
          REQUIRE_DATABASE: "1"
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: mindmeld
          POSTGRES_PASSWORD: mindmeld
        run: |
          psql --version
          pnpm test

      - name: Knip ratchet (fails only on regression or stale baseline)
        run: pnpm run quality:knip

      - name: Coverage ratchet (fails only on regression or stale baseline)
        run: pnpm run quality:coverage
