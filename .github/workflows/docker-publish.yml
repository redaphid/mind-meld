name: Build and Push Docker Images

on:
  # Every commit on main publishes `latest`/`main`. Without this, a merge that
  # does not touch package.json never reaches an image at all: release.yml is
  # gated on `paths: ["package.json"]`, and this workflow used to start only
  # after a successful Release. #139 landed on main at 06:47 and built nothing
  # -- the code was on the default branch and unreachable from any tag a host
  # could pull, with no failure anywhere to say so.
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Kept so a release still republishes, and so the `v*` tag path keeps working
  # when a tag is pushed by a human (a tag pushed by release.yml's GITHUB_TOKEN
  # cannot trigger this workflow -- that is why no `1.2x.0` image tag exists
  # despite four releases).
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., latest, v1.0.0)'
        required: false
        default: 'latest'

# A release commit now matches two triggers at once (the push to main, and the
# workflow_run after Release finishes). Both would push the same `latest` tag,
# and the loser silently decides what `latest` means. Serialize instead of
# cancelling: a cancelled run leaves `latest` pointing at whatever landed last.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mindmeld

jobs:
  # Each architecture builds on a runner of its own architecture. Under QEMU
  # emulation the arm64 `pnpm install` died with SIGILL ("qemu: uncaught target
  # signal 4") and buildkit then waited on it until the 6-hour job limit, so
  # mindmeld-centroids stayed a commit behind the rest and the host, which
  # deploys only a set built from one commit, deployed nothing.
  build:
    runs-on: ${{ matrix.arch.runner }}
    # A build takes minutes; a hang fails here instead of at the 6-hour default.
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - { dockerfile: Dockerfile.postgres, image: postgres }
          - { dockerfile: Dockerfile.sync, image: sync }
          - { dockerfile: Dockerfile.centroids, image: centroids }
          - { dockerfile: Dockerfile.http, image: mcp }
          - { dockerfile: Dockerfile.ui, image: ui }
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, name: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, name: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.target.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Pushed by digest only; the merge job puts the tags on the
      # multi-architecture manifest once both halves exist.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          # One scope per image and architecture: in a shared scope each
          # mode=max export replaced the others' cache.
          cache-from: type=gha,scope=${{ matrix.target.image }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.image }}-${{ matrix.arch.name }}

      - name: Record digest and tags
        env:
          IMAGE: ${{ matrix.target.image }}
          ARCH: ${{ matrix.arch.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p "$RUNNER_TEMP/publish/$IMAGE"
          printf '%s\n' "$DIGEST" >"$RUNNER_TEMP/publish/$IMAGE/digest-$ARCH"
          printf '%s\n' "$TAGS" >"$RUNNER_TEMP/publish/$IMAGE/tags"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.target.image }}-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 1

  # Tags each image whose every architecture built. One image failing still
  # publishes the others, as before; the failed one turns this job red.
  merge:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: publish-*
          path: ${{ runner.temp }}/publish
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifests
        working-directory: ${{ runner.temp }}/publish
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failed=""
          for image in *; do
            digests=("$image"/digest-*)
            if [[ ${#digests[@]} -ne 2 ]]; then
              echo "::error::$image built for ${#digests[@]} of 2 architectures; not tagging it"
              failed+=" $image"
              continue
            fi
            tags=()
            while IFS= read -r tag; do [[ -n "$tag" ]] && tags+=(-t "$tag"); done <"$image/tags"
            sources=()
            for d in "${digests[@]}"; do sources+=("$IMAGE_PREFIX-$image@$(cat "$d")"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}" || failed+=" $image"
          done
          [[ -z "$failed" ]] || { echo "::error::not published:$failed"; exit 1; }
          [[ "$BUILD_RESULT" == success ]] || { echo "::error::a build job ended $BUILD_RESULT"; exit 1; }
