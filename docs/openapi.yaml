openapi: 3.1.0

info:
  title: Mindmeld HTTP API
  version: 1.21.0
  summary: Unified conversation index for Claude Code.
  description: |
    Mindmeld indexes AI coding conversations into PostgreSQL (metadata +
    full-text search) and Chroma (vector embeddings), and serves them back over
    two surfaces on the same port:

    * **MCP** — `/mcp`, a [Model Context Protocol](https://modelcontextprotocol.io)
      Streamable HTTP endpoint. This is what Claude Code talks to, and where
      search/retrieval lives. Its JSON-RPC methods are *not* modelled as REST
      paths here; see the `tools` list in `docs/USAGE.md` for the tool contracts.
    * **REST** — everything else, in one dialect: camelCase keys, a
      `{ status, <resource> }` envelope, and `{ status: 'error', error }` on
      failure. It covers reading the index (`/api/search`, `/api/projects`,
      `/api/sessions`, `/api/messages`), monitoring (`/health`, `/api/status`,
      `/api/logs`, `/api/machines`, `/api/activity`, `/api/quarantine`),
      pipeline diagnostics (`/api/system`, `/api/summaries`,
      `/api/throughput`, `/api/embedding-series`, `/api/sync`), the GPU
      stand-down switch (`/api/stand-down`), and ingest (`/api/ingest`) for
      sources Mindmeld does not sync itself.
    * **UI** — `/`, the browser app in `public/`, which is built on the REST
      endpoints below and nothing else. The UI also ships as its own container
      (the `ui` compose service): a static server for `public/` that
      reverse-proxies `/mcp`, `/api`, `/status`, `/health`, `/logs`, and
      `/openapi.yaml` to this server. Public hostnames (the Cloudflare tunnel)
      point at the `ui` service; this server keeps serving `/` too, so it
      stays fully usable standalone.

    ### Read this first — why Mindmeld looks empty when it is not

    Every item below has caused a caller to conclude that a conversation, or a
    whole capability, does not exist. None of them is an error: each returns
    `200` with a thin or empty result, which is indistinguishable from "never
    indexed" unless you know to look.

    1. **`dataClass` defaults to `coding`.** `/api/search` and the `search` MCP
       tool see *only* `coding`-class data unless told otherwise, so a query
       about phone messages, SMS, notes, or anything else personal returns
       **nothing** — and looks exactly like data that was never captured.
       Classes in use: `coding`, `meetings`, `notes`, `personal`, `test`. The
       vocabulary is open (any lowercase label up to 32 characters), and **only
       `coding` is visible to the default search.** Pass `?dataClass=personal`,
       a repeated or comma-separated list, or `?dataClass=*` for everything.
       Naming a `source` explicitly also bypasses the default. Before deciding
       data is missing, retry with `dataClass=*`.
    2. **A hit's `date` is its *session's* start date, not the matched
       message's.** A phone-app session opened weeks ago still reports its
       original start date for a message that arrived minutes ago. **Do not
       sort or filter on it** —
       doing so hides exactly the recent material you are looking for. To date
       the actual content, read `messages[].timestamp` from
       `/api/sessions/{id}/messages`. The same applies to `since`, which
       filters on session start.
    3. **`/api/sessions/{id}/messages` returns oldest first**, ordered by
       `sequenceNum`. A small `limit` shows the *beginning* of the
       conversation, never the latest — the single most common way to read a
       long session and conclude nothing recent happened in it. For the end,
       page with `offset`, or take the last chunk's message-id range from the
       digest at `/api/sessions/{id}`.
    4. **For anything recent, use `mode=text`.** Full-text search reads the
       `messages` table directly, so a message is findable by text **the
       instant it is written** — no embedding required. Only the *semantic*
       arms wait on vectors, and vectorisation is GPU-bound and can lag by
       minutes or hours (see `/api/system` for whether the GPU gate is holding
       work, and `/api/throughput` for whether the queue is draining). The
       default `hybrid` mode leans on those vectors and will **silently miss**
       data newer than the embedding frontier. So for anything from the last
       few hours, pass `mode=text` with one or two literal tokens — a rare
       word from the exchange — and expect it to work immediately.
    5. **`mode=text` is AND, not OR.** It uses Postgres
       `websearch_to_tsquery`, which requires *every* unquoted term to appear
       in the same message — so a long natural-language question reliably
       matches nothing at all. This is why the advice above says one or two
       literal tokens: `q=message+rates` returns hits, while adding a single
       term that appears nowhere — `q=message+zzzqqx` — drops the count to
       zero. A whole natural-language sentence fails for the same reason: one
       unmatched word is enough to eliminate every row.
    6. **A session with no summary is hidden from *every* search mode.** Both
       the text arm and the semantic arms drop sessions whose `summary` is
       null, on the grounds that they have no real title and cannot be triaged.
       A just-ingested session has no summary until a summarizer pass runs, so
       freshly pushed data can be invisible to search for that reason alone,
       independently of embedding. Pass `includeUnsummarized=true` to reach it.
       Combined with the point above, the reliable recipe for very recent data
       is `mode=text&includeUnsummarized=true&dataClass=*`.
    7. **Writing differs from reading: `POST /api/ingest` takes `content`,
       while every read endpoint returns that same field as `text`.** Each
       message also requires `sequenceNum`. Top-level `dataClass` is required
       only when the ingest would create a new source; for an existing source
       it is ignored, since ingest never reclassifies.

    Also check `degraded` on every search response before drawing a conclusion:
    non-null means the semantic arms were skipped and you are looking at
    full-text results alone, which match words rather than meaning.

    ### No truncation

    Strings are never silently cut. Large results page (`limit`/`offset`, or a
    message-id range); the single exception is one message larger than a whole
    page budget, which comes back explicitly flagged `truncated: true` with a
    pointer to `/api/messages/{id}` for the full text.

    ### Trust model

    There is **no authentication**. The server binds to a Host header allowlist
    (`localhost`, `127.0.0.1`, `[::1]`, `mcp`, plus anything in the
    `ALLOWED_HOSTS` env var) and is meant to be reached over loopback, an SSH
    tunnel, or an authenticated Cloudflare Tunnel — never exposed directly to a
    network you do not control. Reaching it through a tunnel means adding that
    hostname to `ALLOWED_HOSTS`, which makes the UI and every read endpoint
    reachable by anyone who can resolve it: put an access policy in front.
    `/api/ingest` writes to the index unauthenticated, so anything that can
    reach the port can write to your brain.

    The `ui` service enforces the same Host-header allowlist (same
    `ALLOWED_HOSTS` variable) before proxying, because it rewrites the Host
    header on the way upstream — without its own check it would reopen the
    DNS-rebinding hole this allowlist exists to close. It adds no
    authentication: exposing `ui` through a tunnel exposes exactly the same
    unauthenticated surface, including `/api/ingest`.

  license:
    name: See repository
    url: https://github.com/redaphid/mind-meld

servers:
  - url: http://localhost:3847
    description: Default host port published by docker-compose (`MCP_HTTP_PORT`).
  - url: http://mcp:3000
    description: In-container address on the `mindmeld-network` Docker network.

tags:
  - name: MCP
    description: Model Context Protocol Streamable HTTP transport.
  - name: Monitoring
    description: Liveness and pipeline-progress endpoints.
  - name: Ingest
    description: Push conversations from sources Mindmeld does not sync itself.
  - name: Read
    description: Search and read the index — the endpoints the browser UI runs on.
  - name: UI
    description: The browser app served from `public/`.

paths:
  /health:
    get:
      tags: [Monitoring]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Returns immediately without touching Postgres, Chroma, or Ollama. A `200`
        means the process is up — not that the pipeline is healthy. For pipeline
        health use `/status`, or the `health` MCP tool (stdio server only).
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                name: mindmeld
                version: 1.7.1

  /api/status:
    get:
      tags: [Monitoring]
      operationId: getStatus
      summary: Sync, embedding, and collection status
      description: |
        Aggregates per-source sync state, index totals, the embedding backlog,
        Chroma collection sizes, and the most recent non-warmup session. Queries
        Postgres on every call; Chroma is best-effort, so `chroma.collections`
        comes back empty (not an error) when Chroma is unreachable.

        The same handler is served at `/status`, which is shorter to type.

        `pendingEmbeddings` is the backlog a worker will actually pick up, not
        every row without a vector. Read it next to `/api/throughput` (is it
        draining?) and `/api/system` (is the GPU gate holding it?) — a pending
        count alone cannot tell a healthy queue from a stalled one.
      responses:
        '200':
          description: Current pipeline status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: A backing query failed (usually Postgres unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /status:
    get:
      tags: [Monitoring]
      operationId: getStatusShort
      summary: Sync, embedding, and collection status (alias)
      description: |
        A real, permanent path — the same handler as `/api/status`, registered
        under both prefixes so the status screen is reachable without the `/api`
        prefix. Identical request and response.
      responses:
        '200':
          description: Current pipeline status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: A backing query failed (usually Postgres unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /openapi.yaml:
    get:
      tags: [Monitoring]
      operationId: getOpenApiDocument
      summary: This document
      description: Serves `docs/openapi.yaml` as shipped in the running image.
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: The spec file is not present in this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/ingest:
    post:
      tags: [Ingest]
      operationId: ingestConversation
      summary: Upsert a conversation into the index
      description: |
        Upserts a source, project, and session, then inserts the supplied
        messages and recomputes the session's aggregate stats.

        **The field is `content`, not `text`.** Every read endpoint returns a
        message body as `text`; this one accepts it as `content`. Each message
        also requires `sequenceNum` — reads are ordered by it, not by
        `timestamp`.

        **Synchronous.** This is a plain database write: rows land in a second
        or two and the response reflects committed state. Nothing is queued or
        deferred at write time.

        **Idempotent — safe to replay.** Source, project, and session are keyed
        on `externalId`, so re-posting the same payload updates in place rather
        than duplicating. Messages are inserted on conflict-do-nothing by
        `externalId`; `messagesInserted` counts only rows that were new, so a
        replayed payload legitimately returns `0`. There is no need to check
        before writing.

        **Embeddings are not generated here, and are not enqueued here
        either.** Ingested rows simply become visible to the global pending
        predicate, and are vectorised by whichever sync worker runs next —
        `SYNC_INTERVAL_SECONDS` defaults to 3600, and the work is GPU-bound on
        top of that. The practical consequence: a just-ingested message is
        findable by **full-text search immediately** (`mode=text`, plus
        `includeUnsummarized=true` while the session still has no summary) but
        by semantic or the default `hybrid` search only after that run.
      requestBody:
        required: true
        description: The conversation to index. Body limit is 10 MB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
            examples:
              huddle:
                summary: A Slack huddle transcript
                value:
                  source: huddle
                  sourceDisplayName: Slack Huddles
                  dataClass: meetings
                  project:
                    externalId: C0123ABCD
                    name: '#platform-team'
                    path: /slack/platform-team
                  session:
                    externalId: huddle-2026-07-30-1430
                    title: Storefront rollout sync
                    startedAt: '2026-07-30T14:30:00Z'
                    endedAt: '2026-07-30T15:05:00Z'
                  messages:
                    - externalId: huddle-2026-07-30-1430-0
                      role: user
                      content: Do we cut the storefront release before or after the migration?
                      timestamp: '2026-07-30T14:30:12Z'
                      sequenceNum: 0
                      metadata:
                        speaker: alex
                    - externalId: huddle-2026-07-30-1430-1
                      role: user
                      content: After — the migration backfills the columns the storefront reads.
                      timestamp: '2026-07-30T14:30:41Z'
                      sequenceNum: 1
      responses:
        '200':
          description: Conversation indexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          description: |
            The payload failed schema validation (`ValidationError`, with Zod
            issues in `details`), or it would create a new source without a
            `dataClass` (`IngestError`, whose message names the classes in
            use).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/IngestError'
        '500':
          description: Indexing failed (usually Postgres unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestError'

  /:
    get:
      tags: [UI]
      operationId: getApp
      summary: The browser UI
      description: |
        Serves the single-page app in `public/` — an installable PWA (Preact via
        an import map, no build step) that reads the same REST endpoints
        documented here. Routing is hash-based (`/#/search?q=…`), so every view
        is one static document and no server rewrite is involved.

        `index.html` and `sw.js` are sent with `Cache-Control: no-cache` so a
        deploy can never leave a stale shell talking to a newer API.
      responses:
        '200':
          description: The app shell.
          content:
            text/html:
              schema:
                type: string

  /api/search:
    get:
      tags: [Read]
      operationId: search
      summary: Search conversations
      description: |
        The REST form of the `search` MCP tool, returning structured hits instead
        of rendered text. Three modes:

        * `semantic` — vector similarity in Chroma, run across three tiers
          (whole sessions, chunk summaries, individual messages).
        * `text` — Postgres full-text search over message bodies.
        * `hybrid` (default) — both, fused with reciprocal rank fusion.

        Each hit names the tier that matched (`matchedTier`) and, where the match
        was narrower than the whole session, a `cursor` pointing at the chunk or
        message — hand that straight to `/api/sessions/{id}/messages` to read the
        matched region.

        Snippets mark matched terms with `**` (markdown bold), the same rendering
        the MCP tool produces.

        By default only `coding`-class data is searched (see `dataClass`);
        naming a `source` explicitly bypasses that default.
      parameters:
        - name: q
          in: query
          required: true
          description: Query text. Blank or missing is a `400` — there is nothing to rank against.
          schema:
            type: string
          example: how did I set up the cloudflare tunnel
        - name: mode
          in: query
          description: |
            **`text` is the mode to use for anything recent.** It reads the
            `messages` table directly, so a message is findable the instant it
            is written, with no embedding required; `semantic` and the default
            `hybrid` lean on vectors that may lag hours behind, and will
            silently miss newer data.

            The cost is that `text` uses `websearch_to_tsquery`, whose unquoted
            terms are ANDed — every term must appear in the same message, so a
            long natural-language question matches nothing. Use one or two
            literal tokens with it.
          schema:
            type: string
            enum: [hybrid, semantic, text]
            default: hybrid
        - name: limit
          in: query
          description: Hits to return. Capped at 100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: source
          in: query
          description: |
            Restrict to one source. Naming a source bypasses the default
            `dataClass` filter — `source=android` returns android hits even
            though `personal` data is excluded by default.
          schema:
            type: string
            examples: ['claude_code', 'android']
        - name: dataClass
          in: query
          description: |
            **Defaults to `coding` only — the single most common reason a
            search comes back empty.** SMS threads, phone conversations,
            meeting transcripts and notes are all invisible to a plain query,
            and the result is indistinguishable from data that was never
            indexed. If you are looking for anything personal and got nothing,
            retry with `dataClass=*` before concluding it is absent.

            Repeatable or comma-separated (`dataClass=coding,personal`). Every
            source carries a class, and a project may override its source's
            class. Classes currently in use: `coding`, `meetings`, `notes`,
            `personal`, `test` — but the vocabulary is **open**: any lowercase
            label up to 32 characters can be created by ingest, and only
            `coding` is visible to the default search.

            `*` anywhere in the value disables the filter entirely. Naming a
            `source` explicitly is the other escape hatch — it bypasses the
            default too, so `source=android` returns android hits without a
            `dataClass` at all.

            Values are trimmed and lowercased, so miscasing matches rather than
            silently returning nothing. A value not in the live vocabulary is a
            `400` naming the valid classes, again rather than an empty result.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: [coding, personal]
        - name: since
          in: query
          description: |
            Natural-language or absolute cutoff, parsed with chrono
            (`7 days ago`, `last tuesday`, `2026-01-01`).

            **Filters on the session's start, not on message timestamps.** A
            long-running session opened before the cutoff is excluded entirely,
            including the messages it received today — so a narrow `since` can
            hide exactly the recent material you are asking for. Prefer leaving
            it off and reading `messages[].timestamp` to date content.
          schema:
            type: string
        - name: not
          in: query
          description: |
            Negative query. Its embedding is subtracted from the query vector,
            steering results away from a neighbouring topic.
          schema:
            type: string
        - name: cwd
          in: query
          description: |
            A working directory. Sessions from projects at or under this path are
            boosted, and their project ids come back in `projectIds`.
          schema:
            type: string
        - name: projectOnly
          in: query
          description: Restrict results to the projects matching `cwd`, rather than merely boosting them.
          schema:
            type: boolean
            default: false
        - name: includeAutomated
          in: query
          description: |
            Include sessions classified as automated (warmups, monitoring runs).
            Excluded by default because they crowd out real conversations.
          schema:
            type: boolean
            default: false
        - name: includeUnsummarized
          in: query
          description: |
            Include sessions that have not been summarized yet. Excluded by
            default: such a session has no title and no session-level vector, so
            it can only arrive as an untriageable result (issue #95).

            **This filter applies to every mode, including `text`** — so a
            just-ingested session is hidden from search until a summarizer pass
            runs, for this reason alone and independently of embedding. Pass
            true to reach freshly pushed data or the indexing backlog
            deliberately. The reliable recipe for very recent material is
            `mode=text&includeUnsummarized=true&dataClass=*`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Ranked hits, best first.
          content:
            application/json:
              schema:
                type: object
                required: [status, query, mode, count, projectIds, results]
                properties:
                  status:
                    type: string
                    const: ok
                  query:
                    type: string
                  mode:
                    type: string
                    enum: [hybrid, semantic, text]
                  count:
                    type: integer
                  projectIds:
                    type: array
                    description: Project ids matching `cwd`, empty when `cwd` was not given.
                    items:
                      type: integer
                  degraded:
                    type: object
                    nullable: true
                    description: |
                      Null on a complete search. Non-null means the semantic arms
                      were skipped because no query vector could be obtained
                      promptly — Ollama unreachable, or the GPU gate in front of
                      it holding work back — and these results came from
                      full-text alone. Search does not wait one out: a query has
                      someone attached to it, so it degrades in seconds rather
                      than retrying for two minutes.

                      It matters because the two cases are indistinguishable
                      from the results list. Full text matches words, not
                      meaning, so an empty or thin result set here is not
                      evidence the conversation does not exist — retry shortly.
                      In `semantic` mode there is no fallback arm, so results
                      will be empty.
                    required: [semantic, reason]
                    properties:
                      semantic:
                        type: boolean
                        const: false
                      reason:
                        type: string
                        description: The underlying failure, passed through whole.
                        example: '503 GPU is in use by other applications right now'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchHit'
        '400':
          description: Missing `q`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'
        '500':
          description: Search failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/projects:
    get:
      tags: [Read]
      operationId: listProjects
      summary: Every indexed project
      description: |
        The full inventory, ordered by most recent session. Counts include
        automated sessions — this is what was indexed, not what search would
        surface. Unpaged: one row per project, and projects are counted in the
        hundreds, not the millions.
      responses:
        '200':
          description: All projects.
          content:
            application/json:
              schema:
                type: object
                required: [status, count, projects]
                properties:
                  status:
                    type: string
                    const: ok
                  count:
                    type: integer
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '500':
          description: Query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/sessions:
    get:
      tags: [Read]
      operationId: listSessions
      summary: Browse sessions
      description: |
        Sessions newest first, filterable and paged. `total` is the count before
        paging, so a client can size its pager without a second call.

        Summaries come back whole; when a page is too large, ask for a smaller
        `limit` or a later `offset` rather than expecting a cut response.
      parameters:
        - name: limit
          in: query
          description: Capped at 200.
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: projectId
          in: query
          schema:
            type: integer
        - name: source
          in: query
          schema:
            type: string
        - name: machine
          in: query
          description: The computer that indexed the session's project.
          schema:
            type: string
        - name: q
          in: query
          description: |
            Case-insensitive substring match on session title or project name.
            Matches genuine titles only — it no longer matches message bodies by
            way of a fabricated title (issue #95).
          schema:
            type: string
        - name: includeAutomated
          in: query
          schema:
            type: boolean
            default: false
        - name: includeUnsummarized
          in: query
          description: |
            Include sessions that have not been summarized yet. Excluded by
            default (issue #95).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema:
                type: object
                required: [status, total, count, sessions]
                properties:
                  status:
                    type: string
                    const: ok
                  total:
                    type: integer
                    description: Matching sessions before paging.
                  count:
                    type: integer
                    description: Sessions in this page.
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionListItem'
        '500':
          description: Query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/sessions/{id}:
    get:
      tags: [Read]
      operationId: getSessionDigest
      summary: Session digest — summary plus chunk manifest
      description: |
        The middle rung between a search hit and raw messages: the session's
        summary, and a manifest of its chunks. A chunk is a summary of a *span*
        of messages (dozens of them), carrying the message-id range that span
        covers — feed that range to `/api/sessions/{id}/messages` to read it.

        No raw messages are returned here, however large the session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: chunkOffset
          in: query
          description: First chunk to return.
          schema:
            type: integer
            default: 0
        - name: chunkLimit
          in: query
          description: Chunks per page. Capped at 200.
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: The digest.
          content:
            application/json:
              schema:
                type: object
                required: [status, digest]
                properties:
                  status:
                    type: string
                    const: ok
                  digest:
                    $ref: '#/components/schemas/Digest'
        '404':
          description: No such session, or it has been soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/sessions/{id}/messages:
    get:
      tags: [Read]
      operationId: getSessionMessages
      summary: Read raw messages
      description: |
        **Messages come back oldest first**, ordered by `sequenceNum`. A small
        `limit` therefore shows the *beginning* of the conversation and never
        the latest — the most common way to read a long session and wrongly
        conclude nothing recent happened in it. To reach the end, page forward
        with `offset` (`messageCount` from the digest tells you how far), or
        take the last chunk's message-id range from `/api/sessions/{id}`.

        This is also the endpoint that can date content: `messages[].timestamp`
        is the real time a message was written, unlike a search hit's `date`,
        which is its session's start.

        Two ways to read: a window (`offset` + `limit`), or a message-id range
        (`startMessageId` + `endMessageId`, straight off a digest's chunk
        manifest). A range read ignores `offset`.

        Every page is bounded by a character budget, and messages are kept whole
        inside it — the page ends early rather than splitting one. When a single
        message is larger than the entire budget it comes back with
        `truncated: true`, `text` holding the leading slice and `chars` the true
        length; `GET /api/messages/{id}` returns it whole. That is the only place
        in this API where a string is ever cut, and it is always labelled.

        `nextOffset` / `nextStartMessageId` carry the cursor for the next page;
        both `null` means the read is complete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: offset
          in: query
          description: Ignored when `startMessageId` is given.
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Messages to fetch before the budget applies. Capped at 100.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: startMessageId
          in: query
          description: Start of a message-id range. Must be paired with `endMessageId`.
          schema:
            type: integer
        - name: endMessageId
          in: query
          schema:
            type: integer
        - name: maxChars
          in: query
          description: Character budget for the page. Capped at 200000.
          schema:
            type: integer
            default: 60000
            maximum: 200000
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesPage'
        '404':
          description: No messages for that session or range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/messages/{id}:
    get:
      tags: [Read]
      operationId: getMessage
      summary: One message, whole
      description: |
        Uncapped. The escape hatch for a message that a page returned with
        `truncated: true` — reaching a 271K-character message takes this
        deliberate call and can never happen by accident through a page read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: string
                    const: ok
                  message:
                    $ref: '#/components/schemas/Message'
        '404':
          description: No such message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/machines:
    get:
      tags: [Monitoring]
      operationId: getMachines
      summary: What each computer has indexed
      description: |
        Several machines sync into one database. Every project records the
        machine that indexed it, so this answers "what has each computer
        contributed, and when did it last do so".

        `machines` is ordered by most recent indexing. `logWriters` is every
        process that has ever shipped logs — a machine that has gone quiet shows
        up here with a stale `lastLoggedAt` instead of silently disappearing.
      responses:
        '200':
          description: Per-machine activity.
          content:
            application/json:
              schema:
                type: object
                required: [status, thisMachine, lastIndexedMachine, machines, logWriters]
                properties:
                  status:
                    type: string
                    const: ok
                  thisMachine:
                    type: string
                    description: '`MACHINE_NAME` of the process serving this request.'
                  lastIndexedMachine:
                    description: Machine whose sync landed most recently; `null` if nothing is indexed.
                    oneOf:
                      - type: 'null'
                      - type: string
                  machines:
                    type: array
                    items:
                      $ref: '#/components/schemas/MachineActivity'
                  logWriters:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogWriter'

  /api/activity:
    get:
      tags: [Monitoring]
      operationId: getActivity
      summary: Sessions and messages per day
      description: |
        One entry per day, oldest first, with empty days included — a gap in
        indexing reads as a gap rather than as a missing point.
      parameters:
        - name: days
          in: query
          description: Days back from today, inclusive.
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: Daily counts.
          content:
            application/json:
              schema:
                type: object
                required: [status, days, activity]
                properties:
                  status:
                    type: string
                    const: ok
                  days:
                    type: integer
                  activity:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityDay'

  /api/logs:
    get:
      tags: [Monitoring]
      operationId: getLogs
      summary: Logs from every mindmeld process
      description: |
        Every process — sync, mcp, centroids — writes its console output to a
        shared table, so this shows the whole deployment and not just the server
        answering the call. Newest first.

        Also served at `/logs`, which is shorter to type on a phone.

        Messages are returned whole; page with `offset` rather than expecting a
        cut line.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: level
          in: query
          schema:
            type: string
            enum: [log, warn, error]
        - name: machine
          in: query
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
            examples: ['sync', 'mcp']
        - name: contains
          in: query
          description: Case-insensitive substring match on the message.
          schema:
            type: string
      responses:
        '200':
          description: One page of log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsPage'
        '400':
          description: Bad paging or an unknown level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/logs/{machine}:
    get:
      tags: [Monitoring]
      operationId: getMachineLogs
      summary: One machine's logs and indexing
      description: |
        The same feed narrowed to one computer, plus what that computer has
        indexed and the sessions it most recently synced. Also served at
        `/logs/{machine}`.

        A machine counts as known if it has indexed projects *or* shipped logs;
        only when neither is true is it a `404`.
      parameters:
        - name: machine
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: level
          in: query
          schema:
            type: string
            enum: [log, warn, error]
        - name: service
          in: query
          schema:
            type: string
        - name: contains
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Logs, activity, and recent sessions for that machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineLogsPage'
        '404':
          description: Nothing recorded for that machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownMachineError'

  /logs:
    get:
      tags: [Monitoring]
      operationId: getLogsShort
      summary: Logs from every mindmeld process (alias)
      description: |
        A real, permanent path — the same handler as `/api/logs`, registered
        under both prefixes because `/logs` is shorter to type on a phone.
        Identical parameters and response; see `/api/logs`.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: level, in: query, schema: { type: string, enum: [log, warn, error] } }
        - { name: machine, in: query, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: contains, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsPage'
        '400':
          description: Bad paging or an unknown level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /logs/{machine}:
    get:
      tags: [Monitoring]
      operationId: getMachineLogsShort
      summary: One machine's logs and indexing (alias)
      description: |
        A real, permanent path — the same handler as `/api/logs/{machine}`.
        Identical parameters and response.
      parameters:
        - { name: machine, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: level, in: query, schema: { type: string, enum: [log, warn, error] } }
        - { name: service, in: query, schema: { type: string } }
        - { name: contains, in: query, schema: { type: string } }
      responses:
        '200':
          description: Logs, activity, and recent sessions for that machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineLogsPage'
        '404':
          description: Nothing recorded for that machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownMachineError'

  /api/quarantine:
    get:
      tags: [Monitoring]
      operationId: listQuarantine
      summary: Records sync could not process
      description: |
        Sync's dead-letter store. Anything that could not be parsed or inserted
        is kept here whole — the raw bytes, base64 at rest so that nothing in a
        record can break the write that preserves it — with the file, line,
        session and error that produced it.

        A non-zero `pending` means data is *waiting*, not that data was lost. It
        is the number to alert on.

        Payloads are omitted from a listing unless `withPayload` is set; that is
        paging, not truncation, and a payload is always returned whole.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: includeResolved
          in: query
          description: Include records a replay has already recovered. Resolved rows are kept, not deleted.
          schema:
            type: boolean
            default: false
        - name: withPayload
          in: query
          description: Decode and include each record's stored payload.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Quarantined records, most recently attempted first.
          content:
            application/json:
              schema:
                type: object
                required: [status, total, count, pending, records]
                properties:
                  status:
                    type: string
                    const: ok
                  total:
                    type: integer
                    description: Records matching the filter, before paging.
                  count:
                    type: integer
                  pending:
                    type: integer
                    description: Unresolved records, regardless of this page's filter.
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuarantinedRecord'

  /api/quarantine/retry:
    post:
      tags: [Monitoring]
      operationId: retryQuarantine
      summary: Replay quarantined records
      description: |
        Puts records back through exactly the path they failed on — a `parse`
        payload is re-parsed by the same parser sync uses, an `insert` payload is
        the parsed record itself — so a replay can never write something a normal
        sync would not have.

        Safe to call repeatedly. A record that succeeds is marked resolved; one
        that fails again keeps its row with the new error and a bumped attempt
        count. Pass `id` to retry one record, or omit it to work through the
        pending backlog.

        A record whose session does not exist yet is reported, not lost — re-run
        the sync for that file and retry.
      parameters:
        - name: id
          in: query
          description: Retry a single record. May also be given in the body.
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum records to attempt when replaying the backlog.
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: What the replay did.
          content:
            application/json:
              schema:
                type: object
                required: [status, attempted, recovered, outcomes, pending]
                properties:
                  status:
                    type: string
                    const: ok
                  attempted:
                    type: integer
                  recovered:
                    type: integer
                  unrecoverable:
                    type: integer
                    description: |
                      Records retired rather than recovered: the payload holds no
                      data to recover, only NUL bytes left by a write the
                      filesystem never flushed (an unclean shutdown). Retrying
                      one can only fail, so it is resolved — row and payload kept
                      for inspection — and stops counting toward `pending`.
                      Otherwise `quarantined` stays non-zero forever and the one
                      number worth alerting on becomes noise.
                  pending:
                    type: integer
                    description: Records still unresolved after this run.
                  outcomes:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id:
                          type: integer
                        ok:
                          type: boolean
                        error:
                          type: string

  /api/throughput:
    get:
      tags: [Monitoring]
      operationId: getThroughput
      summary: Is the embedding queue being worked off, and when does it end?
      description: |
        A pending count on its own cannot tell a healthy pipeline that is nearly
        done from one that stalled hours ago from one losing ground to incoming
        messages. This measures rates over a recent window — messages embedded,
        new messages arriving, and sessions summarized — and reports the
        difference between the first two, which is the only number an ETA can
        honestly come from.

        The pipeline has two phases at very different speeds: message embedding
        (fast) and session summarization (an LLM pass each, slow). While the
        slow one runs the message rate is legitimately zero, so a state derived
        from that rate alone reported a busy machine as `stalled`.

        `state` is the summary worth reading first:

        | state | meaning |
        |---|---|
        | `caught-up` | nothing left to embed |
        | `draining` | backlog shrinking; `eta` is populated |
        | `holding` | work happening, arrivals cancel it out |
        | `falling-behind` | backlog grew over the window |
        | `summarizing` | no messages embedded, but sessions were summarized — the slow phase is running |
        | `stalled` | work is queued and **neither** phase advanced in the window |

        Ranking, highest first: an embedding verdict (`draining` /
        `falling-behind` / `holding`) outranks `summarizing`, because only it
        carries a rate an ETA can come from; `summarizing` outranks both
        `stalled` and `caught-up`, because naming the phase that is running
        beats a verdict drawn from the phase that is not.

        `eta` is null unless the backlog is actually shrinking: computed from a
        non-positive drain rate it would be infinite or negative, and rendering
        either as a finish time is worse than admitting there isn't one. There is
        no ETA for summarization.

        `pending` and `summariesPending` are built from the embedder's own
        predicate (`src/embeddings/pending.ts`), which `/status` and the sync
        workers also import — so what this endpoint calls pending is what a
        worker will actually pick up, and the two screens cannot disagree.

        This was not always true, and the difference was large: counting every
        message over 10 characters without a vector once reported a backlog of
        32,339 against zero real work, because it included noise already marked
        unembeddable, messages in deleted sessions, and tool messages the
        embedder never touches. A residue that never drains also pins `state` to
        `draining` and produces an ETA years out. If you are reading a
        suspiciously large `pending`, check that nothing has re-inlined a looser
        copy of the predicate.

        `summariesPending` excludes sessions that ended within the last 30
        minutes: re-summarizing a live conversation as it grows is waste, so the
        embedder defers them. That is deferred work, not queued work.
      parameters:
        - name: minutes
          in: query
          description: |
            Measurement window. Clamped to 1..1440 — below that a rate is noise,
            above it the averaging hides what you opened the dashboard to see.
          schema:
            type: integer
            default: 60
            minimum: 1
            maximum: 1440
      responses:
        '200':
          description: Current queue state, rates, and projection.
          content:
            application/json:
              schema:
                type: object
                required: [status, state, queue, rates, eta, window]
                properties:
                  status:
                    type: string
                    const: ok
                  state:
                    type: string
                    enum: [caught-up, draining, holding, falling-behind, summarizing, stalled]
                  queue:
                    type: object
                    required: [pending, embedded, summariesPending]
                    properties:
                      pending:
                        type: integer
                      embedded:
                        type: integer
                      summariesPending:
                        type: integer
                        description: >-
                          Sessions still owed a summary embedding. Same
                          definition as `/status`'s `pendingEmbeddings.sessions`.
                  rates:
                    type: object
                    required:
                      [embeddedPerMinute, arrivedPerMinute, netDrainPerMinute, summarizedPerMinute]
                    properties:
                      embeddedPerMinute:
                        type: number
                      arrivedPerMinute:
                        type: number
                      netDrainPerMinute:
                        type: number
                        description: Positive means the backlog shrinks by this much per minute.
                      summarizedPerMinute:
                        type: number
                        description: >-
                          Sessions summarized per minute. Orders of magnitude
                          smaller than the message rate — a value like 0.07 is a
                          healthy summarization run, not a rounding artefact.
                  eta:
                    type: object
                    required: [secondsRemaining, finishesAt]
                    properties:
                      secondsRemaining:
                        type: integer
                        nullable: true
                      finishesAt:
                        type: string
                        format: date-time
                        nullable: true
                  window:
                    type: object
                    required: [minutes, embedded, arrived, summarized]
                    description: The counts the rates were derived from, so a rate is never read bare.
                    properties:
                      minutes:
                        type: integer
                      embedded:
                        type: integer
                      arrived:
                        type: integer
                      summarized:
                        type: integer
                        description: >-
                          Session summaries completed in the window. This is the
                          signal that separates `summarizing` from `stalled`.

  /api/sync:
    post:
      tags: [Monitoring]
      operationId: startSyncRun
      summary: Run an ingestion pass now
      description: |
        Embeds the messages that are already indexed but have no vector yet, then
        rebuilds the session and project aggregates derived from them — the same
        work the sync workers do on their interval, on demand instead of on a
        timer. This is the half of the pipeline that talks to Ollama, so it is
        what to press after changing where Ollama lives.

        It does **not** rescan transcript files. That half belongs to the sync
        workers, which are the containers holding the read-only transcript
        mounts; this server has none.

        Returns as soon as the run is accepted, never when it finishes: a drain
        takes minutes. Poll `GET /api/sync` for progress. Only one run exists at
        a time — a request while one is in flight is answered `409` with that
        run's state, which is a report, not a failure.
      responses:
        '202':
          description: A run was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunResponse'
        '409':
          description: A run was already in flight; its state is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunResponse'

    get:
      tags: [Monitoring]
      operationId: getSyncRun
      summary: State of the manual ingestion run
      description: |
        The current run if one is in flight, otherwise the last one to finish.
        `running` false with a null `startedAt` means none has been triggered
        since this server started — the state is in memory, not the database.
      responses:
        '200':
          description: Current or most recent run.
          content:
            application/json:
              schema:
                type: object
                required: [status, run]
                properties:
                  status:
                    type: string
                    const: ok
                  run:
                    $ref: '#/components/schemas/SyncRun'

  /api/system:
    get:
      tags: [Monitoring]
      operationId: getSystemStatus
      summary: Why nothing is moving — live probes of Ollama, its GPU gate, Chroma, and CPU
      description: |
        "Nothing is happening" has several causes that look identical from a
        pending count, so this probes each one. **This is the endpoint to read
        when embeddings appear stuck**, before concluding Mindmeld is broken.

        Every field is a live probe with its own 4-second timeout, run
        concurrently, and each degrades to `reachable: false` with the reason
        attached — so this answers even when all three dependencies are down.

        * **`ollama.gate`** — `OLLAMA_URL` does not point at Ollama itself but
          at a small GPU-gating proxy that holds Mindmeld's work back while a
          game or another tenant has the card. Its `/_gate` endpoint separates
          "holding your work deliberately" from "broken", which are otherwise
          indistinguishable. A plain Ollama simply 404s that path, reported as
          `present: false` — not an error, just no gate.
        * **`ollama.models`** — what is resident in VRAM, with `ours` marking
          the models this deployment configured. A chat model nobody here uses
          sitting in VRAM means another tenant is holding the card.
        * **`chroma`** — reachability measured by actually counting every
          configured collection, since a Chroma that answers a heartbeat but
          has lost its collections is broken in a way a heartbeat calls healthy.
        * **`cpu`** — `os.loadavg()`, which is the Docker VM's load, not the
          host's. It is `[0,0,0]` on Windows, hence `loadAvailable`: "idle" and
          "not measured" must not render as the same empty bar.

        GPU load is `otherUtilPct` — utilization percent summed across every
        engine of every non-Ollama process, so **a value above 100 is real and
        not a bug**. It is not VRAM. No Mindmeld container has GPU access, so
        nothing inside one can run `nvidia-smi`; this figure comes from the
        proxy reading Windows GPU Engine counters.
      responses:
        '200':
          description: Live dependency status.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  - $ref: '#/components/schemas/SystemStatus'
        '500':
          description: The probe layer itself failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/summaries:
    get:
      tags: [Monitoring]
      operationId: getSummaryStatus
      summary: The slow phase — what is being summarized right now
      description: |
        Session summarization on its own terms. Message embedding is fast
        enough that a rate describes it well; summarization is not — a chunk
        pass takes 18–110 seconds and a long session is roughly 8 chunks, so
        one session is 5–10 minutes of a single shared GPU. At that speed a
        per-minute average rounds to noise, while the questions that matter are
        *is a session being worked right now, which one, and how far back does
        the queue reach*.

        `oldestPendingStartedAt` answers "how far behind" in a unit that means
        something — a date, not a count.

        **`active[].workers` above 1 is a real problem, not a display quirk.**
        The embedding queue is global and nothing claims a row, so several
        workers genuinely summarize the same session at once and throw away
        each other's output. This endpoint is where that becomes visible;
        `active` is read from the log stream over the last 10 minutes.
      responses:
        '200':
          description: Summarization queue and current activity.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  - $ref: '#/components/schemas/SummaryStatus'
        '500':
          description: Query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/embedding-series:
    get:
      tags: [Monitoring]
      operationId: getEmbeddingSeries
      summary: The pipeline over time, bucketed
      description: |
        What `/api/throughput` averages into a single rate, kept as a series.
        That average cannot distinguish a queue draining steadily from one that
        did all its work in a five-minute burst two hours ago and has been idle
        since — and those call for opposite reactions.

        Three series, because the pipeline has three flows worth telling apart:
        `arrived` (messages synced in — cheap and bursty), `embedded` (messages
        vectorised — the fast phase), and `summarized` (sessions given an LLM
        summary — the slow phase, single digits per minute at best, which is
        why the UI plots it on its own scale).

        Buckets are contiguous and gap-filled: an hour where nothing happened
        is a zero, never a missing point, because a line chart that silently
        closes gaps draws idle time as a slope.

        Counts come from `embeddings.created_at`, which only moves on a row's
        first write — a re-embed is an upsert and bumps nothing — so a pass
        made entirely of re-embeds under-reports rather than over-reports.
      parameters:
        - name: minutes
          in: query
          description: |
            Span to cover. Clamped to 10..1440. The bucket size is derived from
            it to keep roughly 60 points, so the graph stays readable at both
            one hour and one day without the caller choosing.
          schema:
            type: integer
            default: 360
            minimum: 10
            maximum: 1440
      responses:
        '200':
          description: Bucketed series, oldest bucket first.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  - $ref: '#/components/schemas/EmbeddingSeries'
        '500':
          description: Query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/stand-down:
    get:
      tags: [Monitoring]
      operationId: getStandDown
      summary: Is ingestion currently standing down?
      description: |
        Safe to poll. Prefer counting `secondsRemaining` down locally rather
        than re-deriving it from `until` against a client clock that may not
        agree with the server's — the workers, the UI, and Postgres run in
        different containers and their clocks are only approximately friends.

        `standingDown` is false whenever the deadline has passed; every
        consumer should read that flag rather than comparing timestamps itself.
      responses:
        '200':
          description: Current stand-down state.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  - $ref: '#/components/schemas/StandDownState'
        '500':
          description: Query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

    post:
      tags: [Monitoring]
      operationId: standDown
      summary: Ask ingestion to stand down and give the GPU back
      description: |
        "Stop what you are doing and pick it up next cycle." Embedding and
        summarization hold an Ollama slot for minutes at a time; this is how to
        get the card back for a game or a render without stopping containers.

        Three properties of the design are deliberate:

        * **It is a deadline, not a pause flag.** A worker stands down only
          while `stand_down_until` is in the future, so the worst case of a
          forgotten press — or of a worker killed mid-pass — is one skipped
          cycle. It cannot freeze the index. That is also why `minutes` is
          capped at 240: someone who wants the index down for a day should stop
          the container, which is visible, rather than leave a button holding
          it down invisibly.
        * **It gates the embedding phase, not the file sync.** Reading
          transcripts into Postgres never touches the GPU, so conversations
          keep being indexed while standing down; only their vectors wait.
        * **Standing down is not an error.** A sync run that yields records it
          separately from its error list, so monitoring does not read an
          intentional yield as a failed sync.

        The switch is a row in `sync_control`, not process state: the queue
        runs in the sync workers while the UI runs in `mcp`, and Postgres is
        the only thing they both hold. Workers check it at batch boundaries and
        between sessions, so a press takes effect at the next checkpoint rather
        than instantly — the meaningful one is per-session, since a session is
        5–10 minutes of GPU.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:
                  type: number
                  description: |
                    How long to stand down. Clamped to 1..240 and rounded; a
                    missing or unparseable value falls back to the default
                    rather than erroring.
                  default: 15
                  minimum: 1
                  maximum: 240
                reason:
                  type: string
                  nullable: true
                  description: |
                    Free text shown on the dashboard, so a stand-down can say
                    who asked and why. Defaults to null.
            examples:
              gaming:
                summary: Reclaim the GPU for 45 minutes
                value:
                  minutes: 45
                  reason: rendering a comfy workflow
      responses:
        '200':
          description: The resulting state, with the new deadline.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  - $ref: '#/components/schemas/StandDownState'
        '500':
          description: The update failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /api/stand-down/resume:
    post:
      tags: [Monitoring]
      operationId: resumeSync
      summary: Clear the stand-down early
      description: |
        "I finished playing, get back to work" — clearing the deadline rather
        than waiting it out, which would otherwise cost the rest of the window.
        Takes no body. Idempotent: resuming when nothing is standing down is
        not an error and returns the same cleared state.
      responses:
        '200':
          description: Cleared. `standingDown` is false and `secondsRemaining` is 0.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
                  - $ref: '#/components/schemas/StandDownState'
        '500':
          description: The update failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'

  /mcp:
    post:
      tags: [MCP]
      operationId: mcpRequest
      summary: MCP JSON-RPC request (Streamable HTTP)
      description: |
        The MCP Streamable HTTP transport. Send an `initialize` request with no
        `Mcp-Session-Id` header; the response carries the session id, which every
        later request must echo back. Depending on the client's `Accept` header
        the response is either a single JSON-RPC message or an SSE stream.

        Do not hand-roll this — point an MCP client at it:

        ```bash
        claude mcp add --scope user --transport http mindmeld http://localhost:3847/mcp
        ```

        Tools exposed over this endpoint: `search`, `getSession`, `getMessages`,
        `getMessage`, `getChunk`, `stats`, `reportUselessSession`. The stdio
        server (`pnpm run mcp`) additionally exposes `health`,
        `getSessionTranscript`, and the `context` prompt.
      parameters:
        - $ref: '#/components/parameters/McpSessionIdOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcMessage'
            examples:
              initialize:
                summary: Open a session
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2025-06-18'
                    capabilities: {}
                    clientInfo:
                      name: example-client
                      version: 1.0.0
              callSearch:
                summary: Call the search tool
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/call
                  params:
                    name: search
                    arguments:
                      query: how did I set up the SSH tunnel to the embedding Ollama
                      cwd: /home/you/Projects/mind-meld
                      since: 30d
                      limit: 5
      responses:
        '200':
          description: JSON-RPC response, or an SSE stream when the client accepts `text/event-stream`.
          headers:
            Mcp-Session-Id:
              description: Session id, returned on the `initialize` response.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcMessage'
            text/event-stream:
              schema:
                type: string
        '400':
          description: |
            No valid session id, and the body was not an `initialize` request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
        '500':
          description: Transport error while handling the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'

    get:
      tags: [MCP]
      operationId: mcpStream
      summary: Open the server-to-client SSE stream
      description: Opens the notification stream for an already-initialized session.
      parameters:
        - $ref: '#/components/parameters/McpSessionIdRequired'
      responses:
        '200':
          description: SSE stream of server-initiated JSON-RPC messages.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Missing or unknown session id.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid or missing session ID

    delete:
      tags: [MCP]
      operationId: mcpTerminate
      summary: Terminate an MCP session
      parameters:
        - $ref: '#/components/parameters/McpSessionIdRequired'
      responses:
        '200':
          description: Session terminated.
        '400':
          description: Missing or unknown session id.
          content:
            text/plain:
              schema:
                type: string
              example: Invalid or missing session ID
        '500':
          description: Error processing session termination.
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    McpSessionIdOptional:
      name: Mcp-Session-Id
      in: header
      required: false
      description: Omit on `initialize`; required on every subsequent request.
      schema:
        type: string
        format: uuid

    McpSessionIdRequired:
      name: Mcp-Session-Id
      in: header
      required: true
      description: Session id issued by the `initialize` response.
      schema:
        type: string
        format: uuid

  schemas:
    Health:
      type: object
      required: [status, name, version]
      properties:
        status:
          type: string
          const: ok
        name:
          type: string
          const: mindmeld
        version:
          type: string
          description: Version from the running image's `package.json`.
          examples: ['1.7.1']

    Status:
      type: object
      required: [status, version, sync, totals, pendingEmbeddings, quarantined, chroma, latestSession]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        sync:
          type: object
          required: [sources, recentlyProcessed]
          properties:
            sources:
              type: array
              description: One entry per registered source, with its `sessions` sync state.
              items:
                $ref: '#/components/schemas/SourceSyncState'
            recentlyProcessed:
              type: array
              description: Sessions touched by sync in the last 10 minutes, newest first (max 10).
              items:
                $ref: '#/components/schemas/RecentlyProcessedSession'
        totals:
          $ref: '#/components/schemas/IndexTotals'
        pendingEmbeddings:
          type: object
          description: |
            Work the embedding backfill still owes — specifically, work a worker
            will actually pick up. Both counts come from the embedder's own
            predicate (`src/embeddings/pending.ts`), which the sync workers and
            `/api/throughput` import too.
          required: [messages, sessions]
          properties:
            messages:
              type: integer
              description: |
                Messages with indexable text and no `convo-messages` embedding,
                excluding what the embedder will never touch: tool messages,
                deleted and automated sessions, and anything already marked
                unembeddable (noise, or text that failed past its retry budget).
                Counting those too once reported 32,339 pending against zero
                real work.
            sessions:
              type: integer
              description: |
                Sessions with no `convo-sessions` embedding, or whose content has
                grown since the embedding was made. Excludes warmups, deleted and
                automated sessions, and any session that ended within the last 30
                minutes — the embedder defers those rather than re-summarizing a
                live conversation as it grows, so they are not queued work yet.
        quarantined:
          type: integer
          description: |
            Records sync could not process, kept for replay in
            `/api/quarantine`. Non-zero means data is waiting, not lost.
        chroma:
          type: object
          required: [collections]
          properties:
            collections:
              type: array
              description: Empty when Chroma is unreachable — this endpoint does not fail on it.
              items:
                $ref: '#/components/schemas/ChromaCollection'
        latestSession:
          description: Most recent non-briefing session, or `null` if the index is empty.
          oneOf:
            - type: 'null'
            - type: object
              required: [startedAt, title, titleSource, project]
              properties:
                startedAt:
                  type: string
                  format: date-time
                title:
                  oneOf:
                    - type: 'null'
                    - type: string
                titleSource:
                  description: See SearchHit.titleSource.
                  type: string
                  enum: [source, summary, none]
                project:
                  type: string

    SourceSyncState:
      type: object
      required: [name, lastSync, filesProcessed, recordsSynced, lastError]
      properties:
        name:
          type: string
          examples: ['claude_code', 'android', 'huddle']
        lastSync:
          description: Timestamp of the last completed sync, or `null` if never synced.
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        filesProcessed:
          type: integer
        recordsSynced:
          type: integer
        lastError:
          description: Error recorded by the last failed sync, or `null`.
          oneOf:
            - type: 'null'
            - type: string

    RecentlyProcessedSession:
      type: object
      required: [sessionId, title, titleSource, project, lastSyncedAt, messageCount]
      properties:
        sessionId:
          type: integer
        title:
          description: Full resolved session title, or null when there is none.
          oneOf:
            - type: 'null'
            - type: string
        titleSource:
          description: See SearchHit.titleSource.
          type: string
          enum: [source, summary, none]
        project:
          type: string
        lastSyncedAt:
          type: string
          format: date-time
        messageCount:
          type: integer

    IndexTotals:
      type: object
      required: [projects, sessions, messages, embeddings]
      properties:
        projects:
          type: integer
        sessions:
          type: integer
          description: Includes soft-deleted sessions.
        messages:
          type: integer
        embeddings:
          type: integer
          description: Rows in the `embeddings` table (Postgres-side bookkeeping, not Chroma's count).

    ChromaCollection:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
          enum: [convo-messages, convo-sessions, convo-projects, convo-chunks]
        count:
          type: integer

    IngestPayload:
      type: object
      required: [source, project, session, messages]
      properties:
        source:
          type: string
          description: |
            Stable source key. Created on first use. Reusing `claude_code` or
            `cursor` mixes pushed data into what sync owns — prefer a distinct
            key such as `huddle`.
          examples: ['huddle']
        sourceDisplayName:
          type: string
          description: Human-readable label, used only when the source is first created.
        dataClass:
          type: string
          maxLength: 32
          description: |
            Classification stamped on the source when it is first created
            (`coding`, `personal`, `meetings`, …; open vocabulary, lowercase).
            **Required whenever the ingest would create a new source** — a
            payload naming an unknown `source` without a `dataClass` is
            rejected with `400`, and the error lists the classes currently in
            use. A new source's class decides who sees its data, so it must be
            an explicit choice, never a default.

            Normalized on the way in — trimmed and lowercased — because a
            source stamped `"Coding "` would be unreachable from search.

            **An existing source's class is never changed through ingest, and
            neither is an existing session's.** That is a security property,
            not an oversight: this endpoint is unauthenticated, so a later
            ingest must not be able to relabel `android` data as `coding` and
            walk it across the class boundary into a coding agent's default
            results. The response reports the stored class either way, so
            compare `dataClass` in the result against what you sent if it
            matters.
          examples: [meetings]
        machine:
          type: string
          maxLength: 64
          description: |
            The sending computer. Omitted means "unknown" and is recorded as
            null — never relabelled as the machine running this server, which
            did not produce the conversation.
          examples: [studio-laptop]
        os:
          type: string
          maxLength: 32
          description: |
            The sending computer's operating system: `win32`, `wsl`, `linux`,
            `darwin`, … `wsl` is distinct from `linux` on purpose — WSL
            reports itself as Linux while its `/mnt/<letter>` mounts are
            Windows drives on a case-insensitive filesystem, and that is the
            fact that decides whether two project paths differing only in case
            are one directory or two. Omitted is recorded as null: an unknown
            OS is handled conservatively, a guessed one would not be.
          examples: [wsl]
        project:
          type: object
          required: [externalId, name]
          properties:
            externalId:
              type: string
              description: Stable id within the source; the upsert key.
            name:
              type: string
            path:
              type: string
              description: |
                Filesystem path this project maps to. Defaults to `""`. Set it if
                you want `cwd`-aware search boosting to match this project.
        session:
          type: object
          required: [externalId, title, startedAt]
          properties:
            externalId:
              type: string
              description: Stable id within the project; the upsert key.
            title:
              type: string
            startedAt:
              type: string
              format: date-time
            endedAt:
              type: string
              format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/IngestMessage'

    IngestMessage:
      type: object
      required: [externalId, role, content, timestamp, sequenceNum]
      properties:
        externalId:
          type: string
          description: Stable id within the session; duplicates are skipped, not updated.
        role:
          type: string
          examples: ['user', 'assistant', 'system', 'tool']
        content:
          type: string
          description: |
            Full message text. Never pre-truncate — the index stores it whole.

            Note the asymmetry: the field is `content` when writing and `text`
            when reading it back from `/api/messages/{id}` or
            `/api/sessions/{id}/messages`.
        timestamp:
          type: string
          format: date-time
        sequenceNum:
          type: integer
          description: Ordering within the session; reads are ordered by this, not by timestamp.
        metadata:
          type: object
          description: Arbitrary JSON stored alongside the message (speaker, tool call, etc.).
          additionalProperties: true

    IngestResult:
      type: object
      required: [success, sourceId, projectId, sessionId, messagesInserted, dataClass]
      properties:
        success:
          type: boolean
          const: true
        sourceId:
          type: integer
        projectId:
          type: integer
        sessionId:
          type: integer
          description: Use this id with the `getSession` MCP tool.
        messagesInserted:
          type: integer
          description: Newly inserted messages; `0` on a replayed payload.
        dataClass:
          type: string
          description: |
            The source's STORED class — for an existing source this may differ
            from the `dataClass` sent, since ingest never reclassifies.

    SyncRun:
      type: object
      required:
        [running, startedAt, finishedAt, messagesEmbedded, sessionsUpdated, durationMs, error]
      properties:
        running:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Null when no run has been triggered since this server started.
        finishedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while running.
        messagesEmbedded:
          type: integer
          description: Counted on completion; `0` while a run is still in flight.
        sessionsUpdated:
          type: integer
        durationMs:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: |
            Why the last run stopped, verbatim. A GPU gate in front of Ollama
            refusing the work reads as its own 503 explanation here.

    SyncRunResponse:
      type: object
      required: [status, started, run, message]
      properties:
        status:
          type: string
          const: ok
        started:
          type: boolean
          description: False when a run was already in flight, alongside `409`.
        message:
          type: string
        run:
          $ref: '#/components/schemas/SyncRun'

    ValidationError:
      type: object
      required: [success, error, details]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          const: Validation failed
        details:
          type: array
          description: Raw Zod issues.
          items:
            type: object
            additionalProperties: true

    IngestError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string

    ErrorStatus:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          const: error
        error:
          type: string

    JsonRpcMessage:
      type: object
      description: A JSON-RPC 2.0 request, response, or notification. See the MCP specification.
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        method:
          type: string
        params:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
      additionalProperties: true

    JsonRpcError:
      type: object
      required: [jsonrpc, error, id]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
        id:
          type: 'null'

    SearchHit:
      type: object
      required: [sessionId, title, titleSource, project, projectPath, source, dataClass, date, score, matchedTier, snippet, cursor]
      properties:
        sessionId:
          type: integer
        title:
          description: |
            The session's title, resolved and returned whole. Null when the
            session has no source-supplied title and has not been summarized
            yet — a title is never fabricated from message content, because a
            misleading title is worse for triage than an absent one. Use
            `snippet` and `titleSource` in that case.
          oneOf:
            - type: 'null'
            - type: string
        titleSource:
          description: |
            How the title was obtained. `source` means the origin system supplied
            it; `summary` means it was derived from the session summary; `none`
            means the session has neither and `title` is null. A title is never
            fabricated from message content (issue #95).
          type: string
          enum: [source, summary, none]
        project:
          type: string
        projectPath:
          oneOf:
            - type: 'null'
            - type: string
        source:
          type: string
        dataClass:
          type: string
          description: |
            The hit's effective data class — the project's override when set,
            otherwise its source's class (`coding`, `personal`, `meetings`, …).
          examples: [coding, personal, meetings]
        date:
          description: |
            **The session's start time — not the timestamp of the matched
            message.** A session opened weeks ago reports that date for a
            message written minutes ago, so clients must not sort or filter on
            this field: doing so hides the most recent matches. To date the
            matched content, follow `cursor` into
            `/api/sessions/{id}/messages` and read `messages[].timestamp`.
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        score:
          type: number
          description: |
            Fused rank score, plus a boost when the session belongs to a project
            matching `cwd`. Comparable within one response, not across responses.
        matchedTier:
          type: string
          enum: [session, chunk, message]
          description: Which index tier produced the hit.
        snippet:
          description: |
            One line of the matched region, with matched terms wrapped in `**`.
            Null when the region has no usable text.
          oneOf:
            - type: 'null'
            - type: string
        cursor:
          description: Where in the session the match landed; null for a whole-session hit.
          oneOf:
            - type: 'null'
            - type: object
              required: [chunkIndex]
              properties:
                chunkIndex:
                  type: integer
            - type: object
              required: [messageId]
              properties:
                messageId:
                  type: integer

    Project:
      type: object
      required: [id, name, path, source, machine, sessions, messages, lastActivityAt]
      properties:
        id:
          type: integer
        name:
          oneOf:
            - type: 'null'
            - type: string
        path:
          oneOf:
            - type: 'null'
            - type: string
        source:
          type: string
        machine:
          type: string
          description: Computer that indexed it; `unknown` for projects that predate machine stamping.
        sessions:
          type: integer
        messages:
          type: integer
        lastActivityAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time

    SessionListItem:
      type: object
      required:
        [id, title, titleSource, summary, project, projectId, source, machine, messageCount, chunkCount, isAutomated, startedAt, lastSyncedAt]
      properties:
        id:
          type: integer
        title:
          oneOf:
            - type: 'null'
            - type: string
        titleSource:
          description: See SearchHit.titleSource.
          type: string
          enum: [source, summary, none]
        summary:
          description: Full generated summary, or null if it has not been summarised yet.
          oneOf:
            - type: 'null'
            - type: string
        project:
          oneOf:
            - type: 'null'
            - type: string
        projectId:
          type: integer
        source:
          type: string
        machine:
          type: string
        messageCount:
          type: integer
        chunkCount:
          type: integer
          description: Chunks in the manifest; 0 means the session has not been chunked yet.
        isAutomated:
          type: boolean
        startedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        lastSyncedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time

    Chunk:
      type: object
      required: [index, summary, startMessageId, endMessageId, chars]
      properties:
        index:
          type: integer
        summary:
          type: string
          description: Summary of the whole span, not of one message.
        startMessageId:
          type: integer
        endMessageId:
          type: integer
        chars:
          type: integer
          description: Characters of raw message text the span covers.

    Digest:
      type: object
      required:
        [sessionId, projectId, project, title, titleSource, summary, excerpt, messageCount, date, tokens, chunks, chunkOffset, totalChunks]
      properties:
        sessionId:
          type: integer
        projectId:
          type: integer
        project:
          type: string
        title:
          oneOf:
            - type: 'null'
            - type: string
        titleSource:
          description: See SearchHit.titleSource.
          type: string
          enum: [source, summary, none]
        summary:
          oneOf:
            - type: 'null'
            - type: string
        excerpt:
          description: |
            Present only when `summary` is null — a labelled fallback so a digest
            is never blank. Yields to the real summary once one exists.
          oneOf:
            - type: 'null'
            - type: string
        messageCount:
          type: integer
        date:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        tokens:
          type: integer
          description: Input plus output tokens recorded for the session.
        chunks:
          type: array
          description: The page of the manifest starting at `chunkOffset`.
          items:
            $ref: '#/components/schemas/Chunk'
        chunkOffset:
          type: integer
        totalChunks:
          type: integer

    Message:
      type: object
      required: [id, role, text, chars, truncated, toolName, model, timestamp, sequenceNum]
      properties:
        id:
          type: integer
        role:
          type: string
          examples: ['user', 'assistant', 'tool']
        text:
          type: string
          description: |
            The message body — the whole thing, unless `truncated` is true, in
            which case this is its leading slice.
        chars:
          type: integer
          description: True length of the message, whether or not `text` holds all of it.
        truncated:
          type: boolean
          description: |
            True only when this single message exceeded the whole page budget.
            Fetch it whole from `/api/messages/{id}`.
        toolName:
          oneOf:
            - type: 'null'
            - type: string
        model:
          oneOf:
            - type: 'null'
            - type: string
        timestamp:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        sequenceNum:
          oneOf:
            - type: 'null'
            - type: integer

    MessagesPage:
      type: object
      required:
        [status, sessionId, messages, fetched, shown, charBudget, budgetExhausted, nextOffset, nextStartMessageId]
      properties:
        status:
          type: string
          const: ok
        sessionId:
          type: integer
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        fetched:
          type: integer
          description: Rows read from Postgres before the budget was applied.
        shown:
          type: integer
          description: Messages actually returned.
        charBudget:
          type: integer
        budgetExhausted:
          type: boolean
          description: True when the budget, not the end of the range, ended this page.
        nextOffset:
          description: Cursor for the next window read, or null when finished.
          oneOf:
            - type: 'null'
            - type: integer
        nextStartMessageId:
          description: Cursor for continuing a range read, or null when finished.
          oneOf:
            - type: 'null'
            - type: integer

    MachineActivity:
      type: object
      required: [machine, projects, sessions, messages, lastIndexedAt, lastSession]
      properties:
        machine:
          type: string
        projects:
          type: integer
        sessions:
          type: integer
        messages:
          type: integer
        lastIndexedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        lastSession:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, title, project, syncedAt]
              properties:
                id:
                  type: integer
                title:
                  oneOf:
                    - type: 'null'
                    - type: string
                project:
                  oneOf:
                    - type: 'null'
                    - type: string
                syncedAt:
                  oneOf:
                    - type: 'null'
                    - type: string
                      format: date-time

    MachineSession:
      type: object
      required: [id, title, titleSource, project, messageCount, startedAt, syncedAt]
      properties:
        id:
          type: integer
        title:
          oneOf:
            - type: 'null'
            - type: string
        titleSource:
          description: See SearchHit.titleSource.
          type: string
          enum: [source, summary, none]
        project:
          oneOf:
            - type: 'null'
            - type: string
        messageCount:
          type: integer
        startedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time
        syncedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time

    LogEntry:
      type: object
      required: [id, machine, service, level, message, loggedAt]
      properties:
        id:
          type: string
        machine:
          type: string
        service:
          type: string
        level:
          type: string
          enum: [log, warn, error]
        message:
          type: string
          description: The whole line, never cut.
        loggedAt:
          type: string
          format: date-time

    LogWriter:
      type: object
      required: [machine, service, entries, lastLoggedAt]
      properties:
        machine:
          type: string
        service:
          type: string
        entries:
          type: integer
        lastLoggedAt:
          oneOf:
            - type: 'null'
            - type: string
              format: date-time

    LogsPage:
      type: object
      required: [status, name, version, entries, returned, total, limit, offset]
      properties:
        status:
          type: string
          const: ok
        name:
          type: string
          const: mindmeld
        version:
          type: string
        thisMachine:
          type: string
        lastIndexedMachine:
          oneOf:
            - type: 'null'
            - type: string
        machines:
          type: array
          items:
            $ref: '#/components/schemas/MachineActivity'
        logWriters:
          type: array
          items:
            $ref: '#/components/schemas/LogWriter'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        returned:
          type: integer
        total:
          type: integer
          description: Entries matching the filter, before paging.
        limit:
          type: integer
        offset:
          type: integer
        sink:
          type: object
          description: State of this process's own log writer.

    ActivityDay:
      type: object
      required: [day, sessions, messages]
      properties:
        day:
          type: string
          format: date
        sessions:
          type: integer
        messages:
          type: integer

    QuarantinedRecord:
      type: object
      required:
        [id, source, machine, filePath, recordKey, lineNumber, sessionExternalId, sessionId, projectId, stage, error, attempts, firstSeenAt, lastAttemptAt, resolvedAt]
      properties:
        id:
          type: integer
        source:
          type: string
        machine:
          description: The computer whose sync produced the failure.
          oneOf:
            - type: 'null'
            - type: string
        filePath:
          type: string
        recordKey:
          type: string
          description: |
            Identifies the record within its file — `line:<n>` for a parse
            failure, `uuid:<id>` for an insert failure. Re-running sync updates
            the same row rather than piling up duplicates.
        lineNumber:
          oneOf:
            - type: 'null'
            - type: integer
        sessionExternalId:
          oneOf:
            - type: 'null'
            - type: string
        sessionId:
          description: Null when the record failed before its session existed; replay resolves it then.
          oneOf:
            - type: 'null'
            - type: integer
        projectId:
          oneOf:
            - type: 'null'
            - type: integer
        stage:
          type: string
          enum: [parse, insert]
          description: '`parse` — the raw source line. `insert` — the parsed record.'
        payload:
          type: string
          description: The stored record, decoded. Present only when `withPayload` was set.
        error:
          type: string
        attempts:
          type: integer
        firstSeenAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
        resolvedAt:
          description: Set when a replay succeeded. Resolved rows are kept for the record of what fixed it.
          oneOf:
            - type: 'null'
            - type: string
              format: date-time

    MachineLogsPage:
      description: A `LogsPage` narrowed to one machine, plus what that machine has indexed.
      allOf:
        - $ref: '#/components/schemas/LogsPage'
        - type: object
          required: [machine, isThisMachine, activity, sessions]
          properties:
            machine:
              type: string
            isThisMachine:
              type: boolean
              description: True when the machine asked about is the one serving the request.
            activity:
              description: Null when the machine ships logs but has never indexed anything.
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/MachineActivity'
            sessions:
              type: array
              description: That machine's most recently synced sessions. Empty when it has no indexing activity.
              items:
                $ref: '#/components/schemas/MachineSession'

    UnknownMachineError:
      type: object
      required: [status, error, knownMachines]
      properties:
        status:
          type: string
          const: error
        error:
          type: string
        knownMachines:
          type: array
          description: |
            Every machine that has indexed projects or shipped logs — the valid
            values, returned so a typo is self-correcting.
          items:
            type: string

    GateStatus:
      type: object
      description: |
        The GPU-gating proxy in front of Ollama. `OLLAMA_URL` points at this
        proxy, not at Ollama — an indirection that is invisible from inside
        this repo and whose absence presents as ECONNREFUSED on every embed,
        which reads like a Docker fault and is not one.
      required:
        [present, open, gpuInUseNow, quietSeconds, requiredQuietSeconds, holdReason, otherUtilPct, busyThresholdPct, status]
      properties:
        present:
          type: boolean
          description: |
            False when nothing answered `/_gate` — either a plain Ollama (which
            404s the path) or an unreachable proxy. Not an error: running
            against real Ollama is a valid, if less polite, configuration. Every
            other field is null when this is false.
        open:
          description: True when the gate is currently passing work through.
          oneOf: [{ type: 'null' }, { type: boolean }]
        gpuInUseNow:
          description: Whether a non-Ollama process is using the card right now.
          oneOf: [{ type: 'null' }, { type: boolean }]
        quietSeconds:
          description: How long the GPU has been quiet. The gate opens once this reaches `requiredQuietSeconds`.
          oneOf: [{ type: 'null' }, { type: number }]
        requiredQuietSeconds:
          description: |
            The continuous-quiet threshold. Because it must be *continuous*, a
            brief burst of desktop GPU activity resets the counter — which is a
            common reason work sits held for far longer than expected.
          oneOf: [{ type: 'null' }, { type: number }]
        holdReason:
          oneOf: [{ type: 'null' }, { type: string }]
        otherUtilPct:
          description: |
            GPU **utilization percent** by processes that are not Ollama, summed
            across every engine (3D, Copy, VideoDecode, …) of every such
            process — so it can legitimately exceed 100. This is not VRAM. It is
            the only real GPU-load signal available here, since no Mindmeld
            container has GPU access and nothing inside one can run `nvidia-smi`.
          oneOf: [{ type: 'null' }, { type: number }]
        busyThresholdPct:
          description: The utilization above which the gate counts the card as busy.
          oneOf: [{ type: 'null' }, { type: number }]
        status:
          description: |
            The proxy's own full sentence explaining the current state, passed
            through whole — it is already written for a human, and cutting it
            would remove the half that says what to do.
          oneOf: [{ type: 'null' }, { type: string }]

    ResidentModel:
      type: object
      required: [name, sizeVramBytes, contextLength, expiresAt, ours]
      properties:
        name:
          type: string
          examples: ['qwen3:4b-instruct']
        sizeVramBytes:
          type: integer
        contextLength:
          oneOf: [{ type: 'null' }, { type: integer }]
        expiresAt:
          description: When Ollama will evict it from VRAM.
          oneOf: [{ type: 'null' }, { type: string, format: date-time }]
        ours:
          type: boolean
          description: |
            Whether this is one of the models Mindmeld itself is configured to
            use, compared on the bare name so `bge-m3` matches `bge-m3:latest`.
            A resident model with `ours: false` means another tenant is holding
            the card — the difference between "we are slow" and "we are queued
            behind someone else".

    SystemStatus:
      type: object
      required: [ollama, chroma, cpu]
      properties:
        ollama:
          type: object
          required: [url, reachable, version, error, gate, models, vramBytesTotal, configured]
          properties:
            url:
              type: string
              description: The configured `OLLAMA_URL` — an internal container address, shown so "are we pointed at the gating proxy?" is answerable from the screen.
            reachable:
              type: boolean
            version:
              oneOf: [{ type: 'null' }, { type: string }]
            error:
              description: Why the probe failed, or null.
              oneOf: [{ type: 'null' }, { type: string }]
            gate:
              $ref: '#/components/schemas/GateStatus'
            models:
              type: array
              description: Models currently resident in VRAM. Probed even when Ollama is unreachable, since a shut gate is the likeliest reason it answered nothing.
              items:
                $ref: '#/components/schemas/ResidentModel'
            vramBytesTotal:
              type: integer
              description: Sum of `sizeVramBytes` across resident models.
            configured:
              type: object
              description: The models this deployment uses, whether or not they are resident.
              required: [embedding, summarize]
              properties:
                embedding:
                  type: string
                summarize:
                  type: string
        chroma:
          type: object
          required: [url, reachable, error, latencyMs, collections]
          properties:
            url:
              type: string
            reachable:
              type: boolean
              description: Measured by actually counting every configured collection, not by a heartbeat.
            error:
              oneOf: [{ type: 'null' }, { type: string }]
            latencyMs:
              oneOf: [{ type: 'null' }, { type: integer }]
            collections:
              type: array
              items:
                $ref: '#/components/schemas/ChromaCollection'
        cpu:
          type: object
          required: [cores, loadAvailable, load1, load5, load15, loadPerCore, platform, uptimeSeconds, memory]
          properties:
            cores:
              type: integer
            loadAvailable:
              type: boolean
              description: |
                False on Windows, where `os.loadavg()` is hardcoded to
                `[0,0,0]`. Served as a flag rather than as a zero because
                "idle" and "this platform does not measure it" are different
                answers and only one of them should be drawn as an empty bar.
            load1:
              type: number
              description: |
                Unix 1-minute load average. Under Docker Desktop this is the
                Linux VM's load, not the Windows host's — it reflects what the
                containers are doing, which is the question being asked, but it
                is not whole-machine CPU.
            load5:
              type: number
            load15:
              type: number
            loadPerCore:
              type: number
              description: '`load1` divided by `cores` — the only form that means the same thing on a 4-core and a 32-core box.'
            platform:
              type: string
              examples: ['Linux 6.6.0']
            uptimeSeconds:
              type: integer
            memory:
              type: object
              required: [totalBytes, freeBytes]
              properties:
                totalBytes:
                  type: integer
                freeBytes:
                  type: integer

    SummaryStatus:
      type: object
      required: [model, sessions, oldestPendingStartedAt, recent, active]
      properties:
        model:
          type: string
          description: The summarization model this deployment is configured to use.
        sessions:
          type: object
          required: [total, summarized, pending]
          properties:
            total:
              type: integer
              description: Non-deleted sessions.
            summarized:
              type: integer
            pending:
              type: integer
              description: |
                Same predicate as `/api/status`'s `pendingEmbeddings.sessions`
                and `/api/throughput`'s `summariesPending` — imported, not
                restated. Excludes sessions that ended in the last 30 minutes:
                re-summarizing a live conversation as it grows is waste, so
                that is deferred work, not queued work.
        oldestPendingStartedAt:
          description: Start of the oldest session still owed a summary — how far behind the slow phase is, as a date rather than a count. Null when caught up.
          oneOf: [{ type: 'null' }, { type: string, format: date-time }]
        recent:
          type: array
          description: The five sessions whose summaries landed most recently.
          items:
            type: object
            required: [id, title, at]
            properties:
              id:
                type: integer
              title:
                oneOf: [{ type: 'null' }, { type: string }]
              at:
                type: string
                format: date-time
        active:
          type: array
          description: |
            Sessions being summarized right now, read from the log stream over
            the last 10 minutes — the summarizer emits a line per chunk, so a
            session appearing here is one actively holding the GPU. At most 10,
            most recent first.
          items:
            type: object
            required: [sessionId, chunkPasses, workers, lastAt]
            properties:
              sessionId:
                type: integer
              chunkPasses:
                type: integer
                description: Chunk summarization passes logged for this session in the window.
              workers:
                type: integer
                description: |
                  Distinct machine/service pairs working this one session.
                  **Greater than 1 is duplicated work, not a display quirk**:
                  the embedding queue is global and nothing claims a row, so
                  several workers summarize the same session at once and throw
                  away each other's output.
              lastAt:
                type: string
                format: date-time

    EmbeddingSeries:
      type: object
      required: [windowMinutes, bucketMinutes, buckets, totals, peak]
      properties:
        windowMinutes:
          type: integer
          description: The clamped window actually used.
        bucketMinutes:
          type: integer
          description: Derived from the window to keep roughly 60 buckets.
        buckets:
          type: array
          description: Contiguous and gap-filled, oldest first — an idle bucket is a zero, never a missing point.
          items:
            type: object
            required: [at, arrived, embedded, summarized]
            properties:
              at:
                type: string
                format: date-time
                description: Bucket start.
              arrived:
                type: integer
                description: Messages synced in.
              embedded:
                type: integer
                description: Messages vectorised — the fast phase.
              summarized:
                type: integer
                description: Sessions given an LLM summary — the slow phase, and orders of magnitude smaller.
        totals:
          $ref: '#/components/schemas/SeriesCounts'
        peak:
          $ref: '#/components/schemas/SeriesCounts'

    SeriesCounts:
      type: object
      required: [arrived, embedded, summarized]
      properties:
        arrived:
          type: integer
        embedded:
          type: integer
        summarized:
          type: integer

    StandDownState:
      type: object
      required: [standingDown, until, since, reason, secondsRemaining]
      properties:
        standingDown:
          type: boolean
          description: |
            True only while the deadline is still ahead. Read this rather than
            comparing `until` against a local clock.
        until:
          description: When ingestion resumes. Null when not standing down.
          oneOf: [{ type: 'null' }, { type: string, format: date-time }]
        since:
          description: When the stand-down was requested.
          oneOf: [{ type: 'null' }, { type: string, format: date-time }]
        reason:
          description: Free text supplied by whoever asked, shown on the dashboard.
          oneOf: [{ type: 'null' }, { type: string }]
        secondsRemaining:
          type: integer
          minimum: 0
          description: Floor of 0. Count this down locally rather than re-deriving it from `until`.

