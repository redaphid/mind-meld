# Mindmeld - Unified Conversation Index
#
# Quick start:
#   1. Install Ollama (https://ollama.com/download)
#   2. Run: docker compose up -d
#   Models are pulled automatically on first sync.
#
# That's it! Paths auto-detect on macOS. Linux users: see .env.example for paths.

services:
  postgres:
    image: ghcr.io/redaphid/mindmeld-postgres:latest
    container_name: mindmeld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindmeld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmeld}
      POSTGRES_DB: conversations
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mindmeld-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmeld -d conversations"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: mindmeld-chroma
    restart: unless-stopped
    environment:
      CHROMA_SERVER_AUTHN_PROVIDER: ""
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_CORS_ALLOW_ORIGINS: '["*"]'
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - mindmeld-chroma:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: the `sync` worker no longer runs in Docker on macOS. Docker Desktop's
  # container network proxy (gvisor/vpnkit) backpressures Ollama's response
  # stream, inflating chunk summaries from ~3s to ~30s. It now runs as a HOST
  # process via scripts/sync-host.sh (launchd: com.hypnodroid.mindmeld-sync),
  # reaching Ollama over the fast host->tunnel path and Postgres/Chroma via their
  # published ports. On a Linux host where Ollama is local, restore this service.

  # WSL-native Claude Code home (distinct from the Windows-side path the `sync`
  # service above watches via CLAUDE_CODE_PATH). Same DB/Chroma, same schedule.
  sync-wsl:
    image: ghcr.io/redaphid/mindmeld-sync:latest
    container_name: mindmeld-sync-wsl
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmeld}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_URL: ${OLLAMA_EMBEDDING_URL:-http://host.docker.internal:21434}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-300000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-50}
      SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-qwen3:4b-instruct}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      # Stamped onto every project this sync indexes, so /logs/<machine> can
      # tell this WSL distro apart from the Windows host and the laptop —
      # they all use /home/hypnodroid, so paths alone cannot.
      MACHINE_NAME: ${MACHINE_NAME_WSL:-survivor}
    volumes:
      - /home/hypnodroid/.claude:/root/.claude:ro

  centroid-compute:
    image: ghcr.io/redaphid/mindmeld-centroids:latest
    container_name: mindmeld-centroids
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmeld}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      CENTROID_INTERVAL_SECONDS: ${CENTROID_INTERVAL_SECONDS:-25200}

  warmup-filter:
    image: ghcr.io/redaphid/mindmeld-warmups:latest
    container_name: mindmeld-warmups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmeld}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      WARMUP_INTERVAL_SECONDS: ${WARMUP_INTERVAL_SECONDS:-21600}

  mcp:
    image: ghcr.io/redaphid/mindmeld-mcp:latest
    container_name: mindmeld-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmeld}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      MCP_PORT: 3000
      # Reported as `thisMachine` by /logs; without it this falls back to the
      # container id, which tells nobody anything.
      MACHINE_NAME: ${MACHINE_NAME:-windows}
    ports:
      - "${MCP_HTTP_PORT:-3847}:3000"

  # Optional: Cloudflare tunnel for remote access
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mindmeld-cloudflared
    restart: unless-stopped
    depends_on:
      - mcp
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel

volumes:
  mindmeld-postgres:
  mindmeld-chroma:

networks:
  default:
    name: mindmeld-network
